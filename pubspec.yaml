name: projexa
description: "Collaborative Project Execution & Tracking Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  firebase_core: ^4.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# App Icon Start
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/projexa_icon.png"
  min_sdk_android: 21
# App Icon End